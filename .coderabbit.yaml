# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI Code Reviewer Configuration
version: 2
language: "ko-KR" # AI 코드 리뷰 언어: 한국어

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "draft"
    drafts: false
    base_branches:
      - "main"
      - "dev"

  # 리뷰 대상에서 제외할 자동 생성 파일 및 바이너리 경로
  path_filters:
    - "!**/build/**"
    - "!**/.idea/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.webp"
    - "!**/*.3gp"

chat:
  auto_reply: true
